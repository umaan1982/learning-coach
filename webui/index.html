<!doctype html>
<!-- translate="no": Chrome's auto-translate rewrites text nodes behind React's back, which crashes
     the page (black screen) and would also translate the German you're meant to learn. -->
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Learning coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
